# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "master" ]

jobs:
  build:

    permissions:
      actions: read
      contents: read
      packages: read

    concurrency:
      group: mtp-test-history-${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && 'writer' || github.run_id }}
      cancel-in-progress: false

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x.x

      - name: Setup NuGet
        run: dotnet nuget add source --username Texnokaktus-ProgOlymp --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/Texnokaktus-ProgOlymp/index.json"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - id: test-history
        name: Find latest test history
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          run_id="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=mtp-test-history&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == env.DEFAULT_BRANCH)] | first | .workflow_run.id // empty')"
          echo "run-id=${run_id}" >> "${GITHUB_OUTPUT}"
  
      - name: Restore test history
        if: steps.test-history.outputs.run-id != ''
        uses: actions/download-artifact@v8
        with:
          name: mtp-test-history
          path: .test-history
          run-id: ${{ steps.test-history.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Test
        run: |
          dotnet test \
            --no-build \
            --verbosity normal \
            --report-gh \
            --report-gh-history .test-history/history.json \
            --coverage \
            --coverage-output-format cobertura \
            --coverage-output TestResults/coverage.cobertura.xml

      - name: Publish test history
        if: always() && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-artifact@v7
        with:
          name: mtp-test-history
          path: .test-history/history.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        run: |
          reportgenerator \
            -reports:"**/TestResults/**/coverage.cobertura.xml" \
            -targetdir:"coverage-report" \
            -reporttypes:"Cobertura;MarkdownSummaryGithub"

      - name: Add coverage to summary
        run: cat coverage-report/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

  docker:

    permissions:
      contents: write
      packages: write

    needs: build
    runs-on: ubuntu-latest

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: result-service

    outputs:
      name: ${{ steps.get-image-name.outputs.image-name }}
      hash: ${{ steps.build.outputs.imageid }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Version
        id: get-version
        run: echo "version=$(git show --no-patch --format=%ad --date=format:'%Y.%-m.%-d' HEAD).${{ github.run_number }}" >> $GITHUB_OUTPUT
        env:
          TZ: Europe/Moscow

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          sep-tags: ','
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags:
            ${{ steps.get-version.outputs.version }}

      - name: Get image name
        id: get-image-name
        run: echo "image-name=${{ steps.meta.outputs.tags }}" | cut -d, -f1 >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          context: .
          build-args: |
            VERSION=${{ steps.get-version.outputs.version }}
          secrets: |
            GHPAT=${{ secrets.GITHUB_TOKEN }}
          file: src/Texnokaktus.ProgOlymp.ResultService/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Push tag
        run: |
          tag=${{ steps.get-version.outputs.version }}
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git tag "v${tag}"
          git push origin "v${tag}"
